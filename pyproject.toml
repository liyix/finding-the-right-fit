[project]
name = "harness-model-eval"
version = "0.1.0"
description = "Reproducible harness × model benchmark orchestration"
requires-python = ">=3.12"
dependencies = [
    "PyYAML==6.0.3",
    # ALE host-runner dependencies, aligned with the pinned upstream
    # pyproject at commit 0b6465b13c85b5a0a017d4c88bcf979a519a5e1f.
    "openenv-core==0.3.0",
    "cua-bench==0.2.7",
    "pydantic>=2.0",
    "httpx>=0.27",
    "anyio>=4",
    "requests>=2.28",
    "huggingface-hub>=0.28,<2",
    # ALE's host process imports every selected task module and its grader.
    # Mirror the pinned upstream tasks/pyproject.toml dependency surface so a
    # full local-Docker run cannot fail before the sandbox starts.  Exact
    # resolved versions remain frozen by this repository's uv.lock.
    "PyMuPDF>=1.27.2.3",
    "google-api-core>=2.30.3",
    "ltspice>=1.0.6",
    "numpy>=2.4.4",
    "openai>=2.8.0",
    "opencv-python-headless>=4.13.0.92",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pillow>=12.2.0",
    "pretty_midi>=0.2.11",
    "python-dotenv>=1.2.2",
    "safetensors>=0.7.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "sgfmill==1.1.1",
    "torch>=2.11.0",
]

[tool.uv]
package = false
